# Publication inventory; hostnames remain owned by Pulumi.
schema_version = 1
id = "chat"
kind = "first-party"
status = "active"
worker = "spellkave-chat"
hosts = ["chat.spellkave.com"]
needs = ["mcp"]
auth_callback = "/auth/callback"

auth_logout = "/"

[build]
package = "@spellkave/chat"
runner = "nx"
tasks = ["ci-app"]

[build.env_vars]
VITE_WORKOS_CLIENT_ID = "VITE_WORKOS_CLIENT_ID"
VITE_WORKOS_ISSUER = "VITE_WORKOS_ISSUER"
VITE_SPELLKAVE_LOGIN_ORIGIN = "VITE_SPELLKAVE_LOGIN_ORIGIN"

[[smoke]]
path = "/"
status = 200

# Observe before enforcing: per-app browser qualification is a separate rollout.
[csp]
mode = "report-only"
connect = ["'self'", "https://login.spellkave.com", "https://api.workos.com", "https://faithful-century-17.authkit.app", "https://mcp.spellkave.com"]
images = ["'self'", "data:", "blob:"]
fonts = ["'self'"]
