#:schema https://spellkave.dev/schema/world-manifest-1.0.0.json
schema_version = "1.0.0"

# Observer overlay for maps.spellkave.com. Apply AFTER `just play-stage elven-mini`
# so `elven_mini/region` already exists. Bind `$sender` to the maps login token
# that should get god-view (see-as + internal elevation). A player token without
# this bind keeps seats-only overlay off.

[[bundles]]
allow_flat_tags = false
author = "spellkave-maps"
bundle_id = "maps_watch"
default_extent_params_json = ""
default_extent_shape_id = ""
depends_on = ["core", "elven_mini"]
description = "Maps observer see-as over the elven-mini region graph."
display_name = "Maps Watch"
tag_prefixes = []
version = "1.0.0"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "maps_watch"
capability_id = "maps_watch/oversee"
default_visibility = "public"
description = "Sees Hidden and Internal rows of every body inside elven_mini/region."
display_name = "Region oversight"

[[entities]]
bundle_id = "maps_watch"
entity_def_id = ""
entity_key = "maps_watch/observer"
kind = "player"
name = "Maps Observer"
owned_by_entity_key = ""
place_node_id = "elven_mini/region/crossroads"
quantity = 1

[[actors]]
bundle_id = "maps_watch"
entity_key = "maps_watch/observer"
name = "Maps Observer"

[[actor_identities]]
bundle_id = "maps_watch"
entity_key = "maps_watch/observer"
identity = "$sender"
role = "primary"

[[actor_spatial_locations]]
bundle_id = "maps_watch"
entity_key = "maps_watch/observer"
place_node_id = "elven_mini/region/crossroads"
selection_path = "manifest:maps_watch/observer"

[[actor_capabilities]]
actor_entity_key = "maps_watch/observer"
bundle_id = "maps_watch"
capability_id = "maps_watch/oversee"
elevation_class = "internal"
extent_kind_ref = "place_graph"
extent_ref = "elven_mini/region"
source = "maps_watch"
source_args_hash = ""
